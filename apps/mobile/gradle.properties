# Prefer bounded resource use on a self-hosted server that may run other services.
# This limits Gradle, but a sufficiently small host can still run out of memory.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8
org.gradle.workers.max=1
org.gradle.parallel=false
# Avoid an additional Kotlin compiler daemon JVM during the Android build.
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
kotlin.code.style=official
kotlin.mpp.androidSourceSetLayoutVersion=2
