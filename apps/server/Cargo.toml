[package]
name = "field-notes-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"

[dependencies]
axum = "=0.8.6"
tokio = { version = "=1.48.0", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "=0.37.0", features = ["bundled", "serialize"] }
argon2 = "=0.5.3"
aes-gcm = "=0.10.3"
getrandom = "=0.2.16"
sha2 = "=0.10.9"
hex = "=0.4.3"
uuid = { version = "=1.18.1", features = ["v4", "serde"] }
base64 = "=0.22.1"
image = { version = "=0.25.8", default-features = false, features = ["png", "jpeg", "webp"] }
zeroize = "=1.8.2"
