<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>Field Notes</title>
    <link rel="icon" type="image/svg+xml" href="/field-notes-icon.svg" />
    <link rel="stylesheet" href="/app.css" />
    <script src="/planning.js" defer></script>
    <script src="/item-context-data.js" defer></script>
    <script src="/record-types.js" defer></script>
    <script src="/recurrence.js" defer></script>
    <script src="/holidays.js" defer></script>
    <script src="/editor-layout.js" defer></script>
    <script src="/clock-health.js" defer></script>
    <script src="/reminder-timing.js" defer></script>
    <script src="/reminders.js" defer></script>
    <script src="/calendar.js" defer></script>
    <script src="/management.js" defer></script>
    <script src="/lists.js" defer></script>
    <script src="/organization.js" defer></script>
    <script src="/projects.js" defer></script>
    <script src="/assignments.js" defer></script>
    <script src="/archive-zip.js" defer></script>
    <script src="/archive.js" defer></script>
    <script src="/recovery.js" defer></script>
    <script src="/history.js" defer></script>
    <script src="/app.js" defer></script>
  </head>
  <body>
    <div id="app"></div>
    <div id="notice" role="status" aria-live="polite"></div>
    <dialog id="dialog">
      <form id="dialog-form">
        <div id="dialog-body"></div>
        <div class="dialog-actions">
          <button type="button" id="dialog-cancel" class="quiet">Cancel</button
          ><button id="dialog-submit" class="primary">Continue</button>
        </div>
        <p id="dialog-error" class="error" role="alert"></p>
      </form>
    </dialog>
  </body>
</html>
