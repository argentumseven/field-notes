name: Publish one-off Field Notes development APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      FIELD_NOTES_TOOLS: ${{ runner.temp }}/field-notes-tools
    steps:
      - name: Check out exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang cmake pkg-config unzip zip ca-certificates python3
      - name: Build APK using existing verified build scripts
        run: bash scripts/setup/cloud.sh --android
      - name: Package and verify built APK
        run: |
          set -euo pipefail
          source scripts/dev-env.sh
          version=$(python3 -c 'import json; print(json.load(open("release.json"))["version"])')
          apk="dist/android/field-notes-$version-android-arm64-debug.apk"
          test -s "$apk"
          python3 -B scripts/android_artifact.py --apk "$apk" --output dist/android-github
          python3 -B -c 'from scripts.android_artifact import verify; info=verify("dist/android-github"); assert info["signing"]=="development"; assert not info["source_dirty"]'
      - name: Publish verified development prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          short=$(printf '%s' "$GITHUB_SHA" | cut -c 1-12)
          version=$(python3 -c 'import json; print(json.load(open("release.json"))["version"])')
          tag="dev-v${version}-${short}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing development release $tag" >&2
            exit 1
          fi
          gh release create "$tag" dist/android-github/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Field Notes $version Android development APK ($short)" \
            --prerelease --latest=false \
            --notes "One-off development APK built from main at $GITHUB_SHA. Use for fresh installs only unless the signer fingerprint matches your installed app. This workflow's development signing certificate is not guaranteed stable between builds. Never uninstall a paired app with unsynced changes to resolve a signature mismatch. Verify field-notes.apk.sha256 and field-notes.apk.signer.txt alongside the APK."
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url,assets
